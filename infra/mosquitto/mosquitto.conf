# Mosquitto 2 : aucun accès anonyme, un identifiant par client, droits limités par ACL.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Réseau Docker interne (API, ChirpStack sur le même hôte).
listener 1883 0.0.0.0
protocol mqtt

# Passerelles et intégrations externes : MQTT sur TLS uniquement.
# Certificat du domaine obtenu par Caddy (adapter le chemin à votre domaine).
listener 8883 0.0.0.0
protocol mqtt
certfile /certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/DOMAINE/DOMAINE.crt
keyfile /certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/DOMAINE/DOMAINE.key
tls_version tlsv1.2

max_packet_size 16384
